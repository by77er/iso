[package]
name = "iso-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso-ca = { path = "../iso-ca" }
iso-secrets = { path = "../iso-secrets" }
iso-common = { path = "../iso-common" }
async-trait = "0.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-roots", "ring", "tls12"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rcgen = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2", "json"] }

[[bin]]
name = "iso-proxyd"
path = "src/bin/iso-proxyd.rs"
