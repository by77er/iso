[package]
name = "iso-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "URI-level allow/deny rules for the iso egress proxy: grammar, matcher, no I/O"

[dependencies]
iso-common = { path = "../iso-common" }
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
