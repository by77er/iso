[package]
name = "iso-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso-admin-pki = { path = "../iso-admin-pki" }
iso-rpc = { path = "../iso-rpc" }
async-trait = "0.1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "iso-secretsd"
path = "src/bin/iso-secretsd.rs"
