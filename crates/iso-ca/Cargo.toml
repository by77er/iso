[package]
name = "iso-ca"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iso-admin-pki = { path = "../iso-admin-pki" }
iso-rpc = { path = "../iso-rpc" }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
time = "0.3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
x509-parser = "0.16"

[[bin]]
name = "iso-cad"
path = "src/bin/iso-cad.rs"
