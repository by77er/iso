[package]
name = "iso-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iso-fleetd: one API over many iso hosts. Places VMs, remembers where they are, routes by id."

[dependencies]
iso-common = { path = "../iso-common" }
iso-admin-pki = { path = "../iso-admin-pki" }
iso-client = { path = "../iso-client" }
iso-policy = { path = "../iso-policy" }
axum = "0.8.9"
bytes = "1"
http = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iso-controld = { path = "../iso-controld", features = ["testing"] }

[[bin]]
name = "iso-fleetd"
path = "src/bin/iso-fleetd.rs"
