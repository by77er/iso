[package]
name = "iso-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The two transports iso's side services speak: half-close JSON over a Unix socket, and JSON over HTTPS with mutual TLS"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = "1"
serde_json = "1"
tokio = { version = "1.52.3", features = ["net", "io-util", "rt", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
