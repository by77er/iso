[project]
name = "harbor-iso"
version = "0.1.0"
description = "An iso environment for the Harbor agent evaluation framework: each trial runs in a Firecracker microVM built from the task's image, behind iso's egress proxy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["harbor", "httpx>=0.27", "dockerfile-parse"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harbor_iso*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
